<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#082d68">
<title>Foto Calon Kepala Desa | Pilkades 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;background:linear-gradient(140deg,#eaf3ff,#f8fbff);font-family:Poppins,Arial,sans-serif;color:#102c55}
.wrap{max-width:1500px;margin:18px auto;padding:0 18px}
.top{height:6px;border-radius:14px 14px 0 0;background:linear-gradient(90deg,#0875d1 0 34%,#12a66a 34% 67%,#f59e0b 67%)}
.panel{background:#fff;border:1px solid #d3e1f1;border-radius:16px;overflow:hidden;box-shadow:0 12px 30px #082d6818}
.head{text-align:center;padding:22px 16px 17px;background:linear-gradient(135deg,#fff,#f0f6ff)}
.kicker{font-size:11px;font-weight:900;letter-spacing:1.5px;color:#0875d1}
h1{margin:3px 0;color:#082d68;font-size:clamp(27px,3vw,40px);font-weight:900}
.sub{color:#a51f2b;font-weight:800}
.nav{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;margin-top:15px}
.nav a{padding:9px 15px;border-radius:9px;text-decoration:none;color:#fff;font-size:12px;font-weight:800;background:#0875d1}
.nav a:nth-child(2){background:#12a66a}.nav a:nth-child(3){background:#f59e0b}
.content{padding:20px}
.village{margin:0 0 25px}
.village-title{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.village-title h2{margin:0;font-size:21px;color:#082d68}
.village-title span{font-size:11px;font-weight:800;color:#fff;background:#0875d1;border-radius:20px;padding:5px 10px}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}
.card{border:1px solid #d7e3f1;border-radius:14px;overflow:hidden;background:#fff;box-shadow:0 5px 15px #082d6810}
.photo{height:285px;background:#f2f6fb;display:flex;align-items:center;justify-content:center;position:relative}
.photo img{height:100%;width:100%;object-fit:contain}
.no{position:absolute;left:12px;bottom:12px;background:#0875d1;color:#fff;border-radius:10px;padding:7px 13px;font-weight:900;font-size:17px;box-shadow:0 3px 9px #082d6830}
.info{padding:13px 15px 15px}.info small{font-size:10px;color:#0875d1;font-weight:900;letter-spacing:.8px}
.info h3{margin:3px 0;color:#102c55;font-size:17px}.info p{margin:0;color:#64748b;font-size:12px}
.foot{text-align:center;background:#082d68;color:#fff;padding:12px;font-size:11px;font-weight:700}
@media(max-width:900px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.photo{height:250px}}
@media(max-width:600px){.wrap{margin:8px auto;padding:0 8px}.content{padding:13px}.cards{grid-template-columns:1fr}.photo{height:300px}.village-title h2{font-size:18px}}
</style></head>
<body><main class="wrap"><div class="panel"><div class="top"></div>
<header class="head"><div class="kicker">PILKADES SERENTAK 2026 • KECAMATAN SELOREJO</div><h1>FOTO CALON KEPALA DESA</h1><div class="sub">Kenali calon di setiap desa penyelenggara</div>
<nav class="nav"><a href="index.html">01 • COUNTDOWN</a><a href="dashboard.html">03 • SIPITUNG QUICK COUNT</a><a href="hasil.html">04 • HASIL &amp; PEMENANG</a></nav></header>
<div class="content" id="candidate-list"><p style="text-align:center">Memuat data calon...</p></div>
<footer class="foot">SIPITUNG 2026 • PILKADES KECAMATAN SELOREJO</footer></div></main>
<script src="assets/js/bacalon.js"></script>
<script>
(()=>{
 const root=document.getElementById('candidate-list');
 const villages=getDesaBacalon();
 const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 root.innerHTML=villages.map((desa,idx)=>{
   const rows=getBacalonByDesa(desa);
   return `<section class="village"><div class="village-title"><h2>${esc(desa.toUpperCase())}</h2><span>${rows.length} CALON</span></div>
   <div class="cards">${rows.map(c=>`<article class="card"><div class="photo"><img src="assets/images/bacalon/${esc(c.foto_resmi)}" alt="Foto ${esc(c.nama)}"><span class="no">NOMOR ${String(c.no_urut).padStart(2,'0')}</span></div><div class="info"><small>CALON KEPALA DESA • ${esc(c.desa.toUpperCase())}</small><h3>${esc(c.nama)}</h3><p>${esc(c.pekerjaan||'')}</p></div></article>`).join('')}</div></section>`;
 }).join('');
})();
</script></body></html>
