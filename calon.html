<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#082d68">
<title>Foto Calon Kepala Desa | Pilkades 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--navy:#082d68;--blue:#0875d1;--green:#12a66a;--orange:#f59e0b}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;font-family:Poppins,Arial,sans-serif;color:#102c55;background:linear-gradient(140deg,#eaf3ff,#f8fbff)}
body{overflow:hidden}
.page{height:100vh;min-height:0;padding:10px 14px;display:flex;flex-direction:column;gap:9px}
.header{flex:none;min-height:78px;padding:10px 18px;background:#fff;border:1px solid #d3e1f1;border-radius:14px;box-shadow:0 7px 22px #082d6815;position:relative;text-align:center;display:flex;flex-direction:column;justify-content:center}
.header:before{content:"";position:absolute;left:0;right:0;top:0;height:5px;border-radius:14px 14px 0 0;background:linear-gradient(90deg,var(--blue) 0 34%,var(--green) 34% 67%,var(--orange) 67%)}
.kicker{font-size:9px;font-weight:900;letter-spacing:1.7px;color:var(--blue)}
h1{font-size:clamp(20px,2vw,29px);line-height:1.12;margin:2px 0;color:var(--navy);font-weight:900}
.subtitle{font-size:10px;color:#a51f2b;font-weight:800}
.page-nav{display:flex;justify-content:center;align-items:center;gap:6px;flex-wrap:wrap;margin-top:7px}
.page-nav a{display:inline-flex;align-items:center;justify-content:center;padding:5px 10px;border-radius:7px;background:#0875d1;color:#fff;text-decoration:none;font-size:8px;font-weight:900;letter-spacing:.15px;white-space:nowrap;box-shadow:0 2px 5px #082d6820}
.page-nav a[aria-current="page"]{background:#082d68;outline:2px solid #c7dcf4;outline-offset:1px}
.page-nav a:hover{filter:brightness(.93)}

.villages{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.village{--accent:var(--blue);min-width:0;min-height:0;background:#fff;border:1px solid #d3e1f1;border-radius:13px;padding:9px;display:flex;flex-direction:column;gap:7px;box-shadow:0 5px 16px #082d6810;overflow:hidden}
.village:nth-child(2){--accent:var(--green)}.village:nth-child(3){--accent:var(--orange)}
.village-head{flex:none;display:flex;align-items:center;justify-content:space-between;gap:6px;padding:1px 2px 7px;border-bottom:2px solid #e5edf6}
.village-head h2{font-size:clamp(14px,1.25vw,19px);line-height:1.1;margin:0;color:var(--accent);font-weight:900}
.count{white-space:nowrap;background:#eef5fc;color:var(--accent);border-radius:20px;padding:4px 7px;font-size:8px;font-weight:900}
.candidate-list{flex:1;min-height:0;display:grid;grid-template-rows:repeat(var(--rows),minmax(0,1fr));gap:7px}
.candidate{min-height:0;display:grid;grid-template-columns:minmax(70px,34%) minmax(0,1fr);gap:8px;padding:6px;border:1px solid #e0e9f3;border-radius:10px;background:linear-gradient(110deg,#f8fbff,#fff);overflow:hidden}
.photo{min-width:0;min-height:0;background:#edf3fa;border-radius:7px;overflow:hidden;display:flex;align-items:center;justify-content:center}
.photo img{display:block;width:100%;height:100%;object-fit:contain}
.info{min-width:0;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;overflow:hidden}
.number{font-size:8px;font-weight:900;color:#fff;background:var(--accent);border-radius:5px;padding:3px 6px;margin-bottom:4px}
.name{font-size:clamp(10px,1vw,14px);font-weight:900;line-height:1.2;color:#102c55;overflow-wrap:anywhere}
.job{font-size:clamp(8px,.72vw,10px);line-height:1.25;color:#64748b;font-weight:700;margin-top:4px}
.footer{flex:none;height:17px;text-align:center;color:#718096;font-size:8px;font-weight:800;display:flex;align-items:center;justify-content:center}
.empty{grid-column:1/-1;text-align:center;color:#94a3b8;padding:30px}
@media(max-width:850px){
 body{overflow:auto}.page{height:auto;min-height:100vh}.villages{grid-template-columns:1fr;flex:none}.village{min-height:0}.candidate-list{grid-template-rows:none}.candidate{min-height:132px;grid-template-columns:105px minmax(0,1fr)}.photo{height:118px}.name{font-size:14px}.job{font-size:10px}.village-head h2{font-size:18px}
}
@media(min-width:851px) and (max-height:650px){
 .page{padding:6px 10px;gap:6px}.header{min-height:65px;padding:7px 14px}.villages{gap:7px}.village{padding:7px;gap:5px}.candidate-list{gap:5px}.candidate{padding:4px;gap:6px}.footer{height:13px}
}
</style>
</head>
<body>
<div class="page">
<header class="header">
<div class="kicker">PILKADES SERENTAK 2026 • KECAMATAN SELOREJO</div>
<h1>FOTO CALON KEPALA DESA</h1>
<div class="subtitle">Kenali seluruh calon di setiap desa penyelenggara</div>
<nav class="page-nav" aria-label="Navigasi halaman">
  <a href="index.html">01 • COUNTDOWN</a>
  <a href="calon.html" aria-current="page">02 • FOTO CALON</a>
  <a href="dashboard.html">03 • QUICK COUNT</a>
  <a href="hasil.html">04 • HASIL &amp; PEMENANG</a>
</nav>
</header>
<main class="villages" id="candidate-list"><div class="empty">Memuat seluruh data calon...</div></main>
<footer class="footer">SIPITUNG 2026 • PILKADES KECAMATAN SELOREJO</footer>
</div>
<script src="assets/js/bacalon.js"></script>
<script>
(()=>{
 const root=document.getElementById('candidate-list');
 if(typeof getDesaBacalon!=='function'||typeof getBacalonByDesa!=='function'){
 root.innerHTML='<div class="empty">Data calon belum dapat dimuat. Periksa assets/js/bacalon.js.</div>';return;
 }
 const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const villages=getDesaBacalon();
 root.innerHTML=villages.map(desa=>{
 const rows=getBacalonByDesa(desa);
 return `<section class="village">
 <div class="village-head"><h2>${esc(desa.toUpperCase())}</h2><span class="count">${rows.length} CALON</span></div>
 <div class="candidate-list" style="--rows:${Math.max(rows.length,1)}">
 ${rows.map(c=>`<article class="candidate">
 <div class="photo"><img src="assets/images/bacalon/${esc(c.foto_resmi)}" alt="Foto ${esc(c.nama)}" loading="eager"></div>
 <div class="info"><span class="number">NOMOR ${String(c.no_urut).padStart(2,'0')}</span><div class="name">${esc(c.nama)}</div><div class="job">${esc(c.pekerjaan||'')}</div></div>
 </article>`).join('')}
 </div></section>`;
 }).join('');
})();
</script>
</body>
</html>
